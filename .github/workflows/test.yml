name: GovPrompt Tests

on:
  push:
    branches:
      - main
      - 'v7/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check core-engine.js
          node --check shared-context.js
          node --check quality-gate.js
          node --check budget-authority-gate.js
          node --check legal-authority-transition-gate.js
          node --check gp-router.js
          node --check emergency-procurement-gate.js
          node --check workflow-expansion.js
          node --check workflow-orchestration.js
          node --check internal-control-policy.js
      - name: Run test suite
        id: tests
        shell: bash
        run: |
          set +e
          node emergency-procurement-gate-test.js 2>&1 | tee gate-output.txt
          gate_status=${PIPESTATUS[0]}
          if [ "$gate_status" -ne 0 ]; then exit "$gate_status"; fi
          node tests/internal-control-policy.test.cjs 2>&1 | tee internal-control-output.txt
          internal_status=${PIPESTATUS[0]}
          if [ "$internal_status" -ne 0 ]; then exit "$internal_status"; fi
          node tests/internal-control-acceptance.test.cjs 2>&1 | tee internal-control-acceptance-output.txt
          acceptance_status=${PIPESTATUS[0]}
          if [ "$acceptance_status" -ne 0 ]; then exit "$acceptance_status"; fi
          node --test test/*.test.mjs 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output.txt
            gate-output.txt
            internal-control-output.txt
            internal-control-acceptance-output.txt
          retention-days: 1
      - name: Enforce test result
        if: steps.tests.outputs.status != '0'
        run: exit 1
