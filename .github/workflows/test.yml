name: GovPrompt Tests

on:
  push:
    branches:
      - main
      - 'v7/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check core-engine.js
          node --check shared-context.js
          node --check quality-gate.js
          node --check gp-router.js
          node --check workflow-expansion.js
          node --check workflow-orchestration.js
          node --check src/work-tracking/model.mjs
          node --check src/work-tracking/dashboard.mjs
          node --check src/work-tracking/csv-import.mjs
          node --check src/work-tracking/data-quality.mjs
          node --check src/work-tracking/access-control.mjs
          node --check src/work-tracking/audit.mjs
          node --check src/work-tracking/import-preview.mjs
          node --check src/work-tracking/import-rpc-adapter.mjs
          node --check src/work-tracking/project-service.mjs
          node --check src/work-tracking/task-model.mjs
          node --check src/work-tracking/task-service.mjs
          node --check src/work-tracking/command-center.mjs
          node --check src/work-tracking/session-context.mjs
          node --check src/work-tracking/supabase-adapter.mjs
      - name: Run test suite
        run: node --test test/*.test.mjs
