name: GovPrompt Tests

on:
  push:
    branches:
      - main
      - 'v7/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check core-engine.js
          node --check shared-context.js
          node --check quality-gate.js\n          node --check budget-authority-gate.js
          node --check legal-authority-transition-gate.js
          node --check gp-router.js
          node --check workflow-expansion.js
          node --check workflow-orchestration.js
      - name: Run test suite
        id: tests
        shell: bash
        run: |
          set +e
          node --test test/*.test.mjs 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 1
      - name: Enforce test result
        if: steps.tests.outputs.status != '0'
        run: exit 1
