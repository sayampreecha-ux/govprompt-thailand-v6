name: Deploy Work Tracking Pilot to GitHub Pages

on:
  push:
    branches:
      - v7/work-tracking-pilot
    paths:
      - 'work-*.html'
      - 'src/work-tracking/**'
      - 'samples/work-tracking-*'
      - '.github/workflows/pilot-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: work-tracking-pilot-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4

      - name: Build isolated pilot site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _pilot_site
          mkdir -p _pilot_site/src/work-tracking _pilot_site/samples

          # Login is the pilot landing page.
          cp work-login-pilot.html _pilot_site/index.html
          cp work-login-pilot.html _pilot_site/work-login-pilot.html

          # Copy only Work Tracking pilot pages, not the GP production homepage.
          for file in work-*.html; do
            [ -f "$file" ] && cp "$file" _pilot_site/
          done

          cp src/work-tracking/*.mjs _pilot_site/src/work-tracking/

          for file in samples/work-tracking-*; do
            [ -f "$file" ] && cp "$file" _pilot_site/samples/
          done

          touch _pilot_site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pilot artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pilot_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy pilot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
