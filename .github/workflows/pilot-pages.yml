name: Publish Work Tracking Pilot Branch

on:
  push:
    branches:
      - v7/work-tracking-pilot
    paths:
      - 'work-*.html'
      - 'src/work-tracking/**'
      - 'samples/work-tracking-*'
      - '.github/workflows/pilot-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: work-tracking-pilot-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4

      - name: Build isolated pilot site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _pilot_site
          mkdir -p _pilot_site/src/work-tracking _pilot_site/samples

          # Pilot login is the landing page. Production GP index.html is not copied.
          cp work-login-pilot.html _pilot_site/index.html
          cp work-login-pilot.html _pilot_site/work-login-pilot.html

          # Copy only Work Tracking pilot pages.
          for file in work-*.html; do
            [ -f "$file" ] && cp "$file" _pilot_site/
          done

          cp src/work-tracking/*.mjs _pilot_site/src/work-tracking/

          for file in samples/work-tracking-*; do
            [ -f "$file" ] && cp "$file" _pilot_site/samples/
          done

          touch _pilot_site/.nojekyll

      - name: Publish isolated site to gh-pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _pilot_site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: Work Tracking Pilot ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
