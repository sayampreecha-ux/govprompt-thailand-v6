name: Apply Final UX Patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-ux-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture baseline test summary
        run: |
          set +e
          node --test test/*.test.mjs > /tmp/baseline.log 2>&1
          set -e
          grep '^# tests\|^# pass\|^# fail' /tmp/baseline.log > /tmp/baseline.summary || true
          cat /tmp/baseline.summary
      - name: Inject additive external action layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="external-ai-actions.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no </body>')
              s = s.replace('</body>', f'{tag}\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax and zero-regression checks
        run: |
          node --check external-ai-actions.js
          node --check core-engine.js
          node --check shared-context.js
          node --check quality-gate.js
          node --check legal-authority-transition-gate.js
          node --check gp-router.js
          node --check workflow-expansion.js
          node --check workflow-orchestration.js
          set +e
          node --test test/*.test.mjs > /tmp/patched.log 2>&1
          set -e
          grep '^# tests\|^# pass\|^# fail' /tmp/patched.log > /tmp/patched.summary || true
          cat /tmp/patched.summary
          diff -u /tmp/baseline.summary /tmp/patched.summary
          grep -q '<script src="external-ai-actions.js"></script>' index.html
          test "$(grep -o 'class="work-card"' index.html | wc -l)" -eq 12
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.index('id="mainPrompt"') < s.index('id="workGrid"')
          assert 'id="mainSend"' in s
          assert 'id="toolGrid"' in s
          print('UX structural regression checks passed')
          PY
      - name: Commit patched index only when changed
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat(ux): load external AI action layer'
          git push
