<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GovPrompt Thailand v7</title></head>
<body>
<main style="max-width:900px;margin:40px auto;font-family:system-ui,sans-serif;padding:20px"><h1>GovPrompt Thailand v7</h1><p>Government AI Copilot — Legal Authority Transition Gate enabled.</p><textarea id="query" style="width:100%;min-height:180px" placeholder="ระบุคำถามและข้อเท็จจริง"></textarea><button id="build" style="margin-top:12px;padding:10px 18px">สร้าง Prompt v7</button><pre id="output" style="white-space:pre-wrap;background:#0d2545;color:white;padding:18px;border-radius:12px"></pre></main>
<script src="shared-context.js"></script><script src="core-engine.js"></script><script src="legal-authority-transition-gate.js"></script><script src="quality-gate.js"></script>
<script>
const AUTHORITY_PROTOCOL=`GovPrompt v7 — MANDATORY APPLICABLE AUTHORITY / TRANSITION GATE\nสำหรับงานกฎหมาย การเงิน การคลัง พัสดุ บุคคล งบประมาณ สิทธิประโยชน์ หรืออำนาจที่ต้องตีความกฎ:\n1) Answer First ได้เฉพาะระดับที่หลักฐานรองรับ และห้ามฟันธง ได้/ไม่ได้ ขณะ decisionLock=ON\n2) Applicable Rule First: เปิดต้นฉบับ ตรวจฐานอำนาจ ข้อ/มาตรา วันมีผล ฉบับแก้ไข ยกเลิก แทนที่ บทเฉพาะกาล และบุคคล/หน่วยงานที่อยู่ในบังคับ\n3) TIME: แยกวันเกิดข้อเท็จจริงในคดี/หารือออกจากวันออกคำพิพากษาหรือหนังสือ และจับคู่กฎกับวันเกิดเหตุปัจจุบัน\n4) หากอาศัยคำพิพากษา หนังสือหารือ หรือแนววินิจฉัย ห้ามตั้ง VERIFIED/HIGH MATCH จนกว่าจะค้นกฎหมาย ระเบียบ หนังสือกำหนดหลักเกณฑ์ หนังสือสั่งการ หรือ authority ที่ออกภายหลังข้อเท็จจริงของ precedent จนถึงวันเกิดเหตุปัจจุบัน\n5) เมื่อพบ authority ภายหลัง ต้องเปิดต้นฉบับและวิเคราะห์ว่าทำให้ rule/fact pattern ปัจจุบันต่างจาก precedent หรือไม่ ห้ามกล่าวว่า rule ใหม่ลบคำพิพากษาโดยอัตโนมัติ และห้ามละเลย rule ใหม่เพียงเพราะ precedent เป็นคำพิพากษาประชุมใหญ่\n6) FACT MATCH: เทียบบุคคล หน่วยงาน ลำดับเหตุการณ์ ขั้นตอน เงื่อนไขสิทธิ กฎหมายชุดเดียวกัน และวันที่สำคัญ\n7) CONTRARY EVIDENCE: ค้นหลักฐานที่อาจหักล้างข้อสรุปเดิมและ resolve ก่อน final\n8) ถ้ายังไม่รู้วันข้อเท็จจริงของ precedent, วันเหตุปัจจุบัน, ยังไม่จบ later-authority search, rule-version check, contrary-evidence check หรือยังมี authority ภายหลังที่ transitionResolved=false ให้สถานะ BLOCKED_LATER_AUTHORITY_CHECK / UNVERIFIED และตอบ 🔎 หลักฐานยังไม่พอที่จะฟันธง หรือ ⚠️ ได้โดยมีเงื่อนไขตามที่หลักฐานรองรับ\n9) ตัวอย่าง regression บังคับ: หากพบ อ.24/2567 ต้องตรวจวันที่ข้อเท็จจริงในคดี ไม่ใช้ปี 2567 แทนวันเกิดเหตุ และสำหรับเหตุหลัง 6 ก.พ.2561 ต้องค้น/เปิด/วิเคราะห์ มท 0808.2/ว 0679 ลงวันที่ 6 ก.พ.2561 รวมถึงข้อ 14 และฉบับแก้ไขที่ใช้กับเหตุ ก่อนสรุปสิทธิค่าเช่าบ้าน/เช่าซื้อ\n10) ผลสุดท้ายใช้เพียง ✅ ได้ / ❌ ไม่ได้ / ⚠️ ได้โดยมีเงื่อนไข / 🔎 หลักฐานยังไม่พอที่จะฟันธง พร้อมฐานอำนาจและสิ่งที่ยังต้องตรวจ`;
document.getElementById('build').onclick=()=>{const q=document.getElementById('query').value.trim();document.getElementById('output').textContent=`บทบาท\nคุณเป็น Government AI Copilot สำหรับงานราชการไทยแบบครอบคลุม\n\nคำถามจากผู้ใช้\n${q||'[ยังไม่ได้ระบุ]'}\n\n${AUTHORITY_PROTOCOL}\n\nดำเนินการค้น ตรวจ เปรียบเทียบ และตอบตามหลักฐานจริงทันที ห้ามอ้างว่าตรวจแล้วหากยังไม่ได้ตรวจ`;};
</script></body></html>
